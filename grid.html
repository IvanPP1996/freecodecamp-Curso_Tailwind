<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Implementando Tailwind CSS -->
    <link href="./src/output.css" rel="stylesheet">
    <title>Tailwind - Grid</title>
</head>
<body class="p-4">

    <div class="grid grid-cols-4 gap-4">
        
        <div class="card-grid col-span-2">1</div>
        <div class="card-grid">2</div>
        <div class="card-grid">3</div>
        <div class="card-grid row-span-3">4</div>
        <div class="card-grid col-span-2">5</div>
        <div class="card-grid">6</div>
        <div class="card-grid col-[2/5]">7</div>
        <div class="card-grid">8</div>
        <div class="card-grid">9</div>
        
    </div>

    <br><br>

    <div class="grid grid-cols-2 gap-4 h-[100vh]">

        <div class="card-grid col-span-2">header</div>
        <div class="card-grid col-span-2">nav</div>
        <div class="card-grid">section</div>
        <div class="card-grid">article</div>
        <div class="card-grid row-[3/5] col-start-2">aside</div>
        <div class="card-grid col-span-2">footer</div>

    </div>

</body>
</html>
